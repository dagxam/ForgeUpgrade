# ============================================================
# ForgeUpgrade — улучшения
# ============================================================
# Здесь описаны четыре обычные ступени и секретный Армагедон.
# Значения усиления НЕ складываются между собой.

золотое:
  отображаемое_имя: "Золотое улучшение"
  внутренний_уровень: 10
  отделка: "Дюна"
  рецепт:
    скрытый: false
    схема:
      - "БББ"
      - "БЗБ"
      - "БББ"
    материалы:
      Б: "БУМАГА"
      З: "ЗОЛОТОЙ_СЛИТОК"

изумрудное:
  отображаемое_имя: "Изумрудное улучшение"
  внутренний_уровень: 30
  отделка: "Прилив"
  рецепт:
    скрытый: false
    схема:
      - "БББ"
      - "БИБ"
      - "БББ"
    материалы:
      Б: "БУМАГА"
      И: "ИЗУМРУД"

алмазное:
  отображаемое_имя: "Алмазное улучшение"
  внутренний_уровень: 50
  отделка: "Поток"
  рецепт:
    скрытый: false
    схема:
      - "БББ"
      - "БАБ"
      - "БББ"
    материалы:
      Б: "БУМАГА"
      А: "АЛМАЗ"

незеритовое:
  отображаемое_имя: "Незеритовое улучшение"
  внутренний_уровень: 70
  отделка: "Страж"
  рецепт:
    скрытый: false
    схема:
      - "БББ"
      - "БНБ"
      - "БББ"
    материалы:
      Б: "БУМАГА"
      Н: "НЕЗЕРИТОВЫЙ_СЛИТОК"

армагедон:
  отображаемое_имя: "Армагедон"
  внутренний_уровень: "БЕСКОНЕЧНОСТЬ"
  скрытое_улучшение: true
  бесконечное_улучшение: true
  рецепт:
    скрытый: true
    схема:
      - "МЖЛ"
      - "ЗБР"
      - "ИБН"
    материалы:
      М: "МЕДНЫЙ_СЛИТОК"
      Ж: "ЖЕЛЕЗНЫЙ_СЛИТОК"
      Л: "ЛАЗУРИТ"
      З: "ЗОЛОТОЙ_СЛИТОК"
      Б: "БУМАГА"
      Р: "РЕДСТОУН"
      И: "ИЗУМРУД"
      А: "АЛМАЗ"
      Н: "НЕЗЕРИТОВЫЙ_СЛИТОК"

# ============================================================
# Правила применения
# ============================================================
# Золотое  -> все характеристики предмета становятся +10.
# Изумрудное -> все характеристики предмета становятся +30.
# Алмазное -> все характеристики предмета становятся +50.
# Незеритовое -> все характеристики предмета становятся +70.
# Армагедон -> уровень не ограничен и продолжает расти бесконечно.
# Нельзя складывать +10 +30 +50 +70: новая ступень заменяет старую.
