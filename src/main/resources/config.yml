# ============================================================
# ForgeUpgrade — основная конфигурация
# ============================================================
# Все значения и пояснения в этом файле находятся на русском языке.
# Позже здесь будут добавляться настройки баланса и поведения.

# Включать ли подробные сообщения в консоли.
подробное_логирование: true

# Числа улучшений каждой ступени.
# ВАЖНО: значения не складываются.
# Каждая новая ступень заменяет предыдущую.
улучшения:
  золотое: 10
  изумрудное: 30
  алмазное: 50
  незеритовое: 70
  армагедон: бесконечность

# Секретный рецепт Армагедона не должен отображаться в книге рецептов.
армагедон:
  скрытый_рецепт: true
  бесконечное_улучшение: true

# Визуальные шаблоны отделки для улучшенной брони.
# Эти названия используются как внутренняя настройка системы.
отделки:
  золотое: "Дюна"
  изумрудное: "Прилив"
  алмазное: "Поток"
  незеритовое: "Страж"

# Сила специальных способностей Армагедона.
способности:
  броня:
    шлем: "Ночное зрение"
    нагрудник: "Полёт"
    поножи: "Иммунитет к огню и лаве; бесконечное дыхание под водой"
    ботинки: "Высокий прыжок; небольшое увеличение скорости"
  оружие:
    меч: "Убийство с одного удара"
    копьё: "Убийство с одного удара"
    топор: "Убийство с одного удара"
    лук: "Убийство с одного выстрела; бесконечные стрелы при наличии хотя бы одной стрелы"
    арбалет: "Убийство с одного выстрела; бесконечные стрелы при наличии хотя бы одной стрелы"
